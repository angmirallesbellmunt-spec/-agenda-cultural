name: Actualitza agenda

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instal·la dependències
        run: pip install -r requirements.txt

      - name: Actualitza activitats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python update.py

      - name: Desa els canvis
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add data/events.json

          if git diff --cached --quiet; then
            echo "No hi ha canvis a desar"
            exit 0
          fi

          git commit -m "Actualitza agenda"
          git pull --rebase origin main
          git push origin main

<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda cultural</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--ultra:#3047D8;--cream:#F4F0E8;--ink:#171717;--lime:#C8FF45;--violet:#8D65FF;--pink:#FF9BBC;--paper:#FBF9F4;--line:#b7b3aa}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Archivo,Arial,sans-serif}a{color:inherit}.hero{min-height:390px;border-bottom:1px solid var(--ink);display:grid;grid-template-columns:minmax(0,2.1fr) minmax(280px,.9fr);overflow:hidden}.hero-main{position:relative;padding:24px 2.4vw 20px;display:grid;grid-template-columns:1fr 190px;grid-template-rows:auto 1fr;gap:12px}.brand{font:500 13px/1.05 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.02em}.masthead{grid-column:1/-1;align-self:end;position:relative;z-index:2;color:var(--ultra);font-size:clamp(76px,10.6vw,174px);font-weight:700;letter-spacing:-.075em;line-height:.73;text-transform:uppercase}.masthead span{display:block}.lime-mark{position:absolute;left:9%;top:-80px;width:95px;height:530px;background:var(--lime);transform:rotate(35deg);border-radius:70px;z-index:0}.intro{position:absolute;right:2.4vw;bottom:31px;width:175px;font-size:14px;line-height:1.2;z-index:3}.hero-art{position:relative;background:var(--ultra);overflow:hidden}.hero-art:before{content:"CULTURA\A ARA";white-space:pre;position:absolute;top:24px;right:22px;color:var(--cream);font:500 13px/1.3 'IBM Plex Mono',monospace;text-align:right;z-index:2}.hero-art:after{content:"↗";position:absolute;font-size:260px;line-height:1;color:var(--pink);font-weight:400;left:10%;bottom:-50px;transform:rotate(-18deg)}.filters-wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 2.4vw;border-bottom:1px solid var(--line)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{font:500 13px Archivo,sans-serif;border:1px solid #8e8a82;background:transparent;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.2s}.filters button:hover{background:white}.filters button.active{background:var(--lime);border-color:var(--lime);color:var(--ink)}.search{font:400 13px 'IBM Plex Mono',monospace;border-bottom:1px solid var(--ink);padding:8px 2px;min-width:205px}.search:before{content:"⌕  ";font-size:18px}.grid{padding:22px 2.4vw 60px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{grid-column:span 4;background:var(--paper);border:1px solid #d4d0c7;display:grid;grid-template-rows:auto 1fr;min-width:0;position:relative}.card:nth-child(5n+1){grid-column:span 5}.card:nth-child(5n+3){grid-column:span 3}.media{aspect-ratio:16/9;background:var(--ultra);overflow:hidden;position:relative}.media img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92) contrast(1.02);transition:transform .5s ease}.card:hover .media img{transform:scale(1.025)}.body{padding:15px 16px 16px;display:grid;grid-template-columns:74px 1fr;column-gap:14px;align-content:start;min-height:190px}.date{grid-row:1/7;font-size:34px;font-weight:800;line-height:.82;letter-spacing:-.06em;text-transform:uppercase;color:var(--ink)}.date small{display:block;margin-top:8px;font:500 10px/1.3 'IBM Plex Mono',monospace;letter-spacing:0}.source{font:500 10px/1.2 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}.title{font-size:clamp(20px,2vw,29px);font-weight:700;line-height:.94;letter-spacing:-.045em;margin:0 0 9px}.sessions{font:400 11px/1.25 'IBM Plex Mono',monospace;margin-bottom:8px}.place{font-size:12px;line-height:1.25;margin-top:6px}.tag{justify-self:start;background:var(--lime);padding:4px 7px;font:500 10px/1 'IBM Plex Mono',monospace;text-transform:uppercase;margin:8px 0}.card:nth-child(4n+2) .tag{background:var(--violet);color:white}.card:nth-child(4n+3) .tag{background:var(--pink)}.go{margin-top:12px;font:500 12px/1 'IBM Plex Mono',monospace;text-decoration:none;display:flex;justify-content:space-between;border-top:1px solid #aaa59b;padding-top:10px}.empty{grid-column:1/-1;padding:40px;border:1px dashed var(--ink);font-family:'IBM Plex Mono',monospace}
@media(max-width:950px){.hero{grid-template-columns:1fr}.hero-art{display:none}.hero-main{min-height:360px}.grid{grid-template-columns:repeat(2,1fr)}.card,.card:nth-child(n){grid-column:span 1}.filters-wrap{align-items:flex-start;flex-direction:column}.search{width:100%}}
@media(max-width:620px){.hero-main{min-height:310px;padding:20px}.masthead{font-size:clamp(64px,22vw,105px);line-height:.76}.lime-mark{width:60px;height:400px}.intro{display:none}.grid{grid-template-columns:1fr;padding:14px}.body{grid-template-columns:64px 1fr}.filters-wrap{padding:14px}.filters button{padding:8px 12px}}
</style>
</head>
<body>
<header class="hero"><section class="hero-main"><div class="lime-mark"></div><div class="brand">Agenda<br>cultural</div><div class="masthead"><span>Agenda</span><span>Cultural</span></div><p class="intro">Activitats recollides automàticament de Figueres a Escena, Museu de l’Empordà i Agenda de la Bisbal.</p></section><aside class="hero-art"></aside></header>
<section class="filters-wrap"><div class="filters" id="filters"></div><div class="search">Buscar activitats...</div></section>
<main class="grid" id="grid"><div class="empty">Carregant activitats…</div></main>
<script>
let DATA=[], current="Totes";
const month=d=>new Intl.DateTimeFormat("ca-ES",{month:"short"}).format(new Date(d+"T12:00:00")).replace('.','').toUpperCase();
function dateBlock(s){if(!s?.date)return `—<small>DATA<br>PENDENT</small>`;const x=new Date(s.date+"T12:00:00");return `${String(x.getDate()).padStart(2,'0')}<br>${month(s.date)}<small>${s.time||''}</small>`}
function render(){
 const rows=DATA.filter(e=>current==="Totes"||e.municipality===current);
 document.querySelector("#grid").innerHTML=rows.length?rows.map(e=>{const s=e.sessions?.[0];return `<article class="card"><div class="media">${e.image?`<img loading="lazy" src="${e.image}" alt="">`:""}</div><div class="body"><div class="date">${dateBlock(s)}</div><div class="source">${e.source||''}</div><h2 class="title">${e.title}</h2>${e.sessions?.length>1?`<div class="sessions">+ ${e.sessions.length-1} sessions més</div>`:""}<div class="place">${e.venue||"Espai per confirmar"}<br>${e.municipality||''}</div>${e.category?`<span class="tag">${e.category}</span>`:""}<a class="go" href="${e.url}" target="_blank" rel="noopener"><span>Veure activitat</span><span>↗</span></a></div></article>`}).join(""):`<div class="empty">No hi ha activitats per aquest filtre.</div>`;
}
fetch("data/events.json").then(r=>{if(!r.ok)throw new Error();return r.json()}).then(j=>{DATA=j.events||[];const vals=["Totes",...new Set(DATA.map(e=>e.municipality).filter(Boolean))];document.querySelector("#filters").innerHTML=vals.map(v=>`<button data-v="${v}" class="${v==="Totes"?"active":""}">${v}</button>`).join("");document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{current=b.dataset.v;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("active",x===b));render()});render()}).catch(()=>document.querySelector("#grid").innerHTML='<div class="empty">Per veure les activitats reals, mantén aquest arxiu al costat de la carpeta <b>data</b> i obre el projecte amb el servidor local.</div>');
</script></body></html>

<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda cultural</title>
<style>
:root{--ultra:#3047D8;--cream:#F4F0E8;--ink:#171717;--lime:#C8FF45;--violet:#8D65FF;--pink:#F3B7CA;--paper:#FBF9F4;--line:rgba(23,23,23,.16)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif}.hero{position:relative;overflow:hidden;padding:24px 4vw 28px;border-bottom:1px solid var(--ink);min-height:370px}.topline{display:flex;align-items:center;gap:24px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.topline:after{content:"";height:1px;background:var(--ultra);flex:1}.mast{position:relative;z-index:2;margin:30px 0 0;color:var(--ultra);font-weight:800;font-size:clamp(72px,12vw,174px);line-height:.72;letter-spacing:-.075em;text-transform:uppercase}.mast span{display:block}.intro{position:absolute;z-index:3;right:5vw;top:112px;width:min(30vw,390px);font-size:clamp(16px,1.5vw,23px);line-height:1.12}.lime-slash{position:absolute;z-index:1;width:72px;height:570px;background:var(--lime);left:37%;top:-135px;transform:rotate(35deg)}.pink-corner{position:absolute;right:-55px;bottom:-105px;width:230px;height:180px;border-radius:50% 50% 0 0;background:var(--pink)}
.toolbar{padding:18px 4vw;border-bottom:1px solid var(--line);display:grid;gap:14px}.search{width:min(100%,520px);border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:14px;background:transparent}.quick,.filterrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.quick button{border:0;background:#E8E5DF;padding:10px 15px;border-radius:999px;cursor:pointer;font-weight:600}.quick button.active{background:var(--lime)}select{border:1px solid var(--line);border-radius:999px;padding:10px 15px;background:var(--paper);font-weight:600}
main{padding:30px 4vw 70px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px}.card{background:var(--paper);border-bottom:1px solid var(--line)}.media{aspect-ratio:1/1;background:#e9e5dc;overflow:hidden;display:flex;align-items:center;justify-content:center}.media img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}.media img.portrait{object-fit:contain}.body{display:grid;grid-template-columns:98px 1fr;min-height:170px}.datebox{padding:17px 8px;border-right:1px solid var(--line);color:var(--ultra);font-weight:800;text-transform:uppercase;text-align:left;display:flex;flex-direction:column;align-items:flex-start}.day{font-size:42px;line-height:.82;width:100%;text-align:left}.month{font-size:17px;margin-top:6px;width:100%;text-align:left}.time{margin-top:11px;color:var(--ink);font-size:19px;font-weight:800;text-transform:none;width:100%;text-align:left;white-space:nowrap}.range{font-size:12px;line-height:1.25}.content{padding:17px 18px 16px;display:flex;flex-direction:column}.tag{align-self:flex-start;padding:5px 8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--violet)}.card:nth-child(3n+2) .tag{background:var(--pink)}.card:nth-child(3n) .tag{background:var(--lime)}.municipality{margin-top:5px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ultra)}.title{font-size:clamp(21px,2vw,29px);line-height:.98;font-weight:750;letter-spacing:-.04em;margin:10px 0 12px;text-transform:uppercase}.place{margin-top:auto;font-size:13px}.more{margin-top:12px;font-size:12px}.link{display:flex;justify-content:flex-end;text-decoration:none}.arrow{font-size:28px}.empty{grid-column:1/-1;padding:42px;border:1px dashed var(--ink)}
@media(max-width:980px){.intro{position:relative;right:auto;top:auto;width:60%;margin:24px 0 0 auto}main{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.hero{padding:18px;min-height:auto}.mast{font-size:clamp(62px,22vw,104px)}.intro{width:82%;font-size:16px}.toolbar{padding:14px 18px}main{padding:20px 18px 50px;grid-template-columns:1fr}.body{grid-template-columns:88px 1fr}}
</style></head><body>
<header class="hero"><div class="lime-slash"></div><div class="pink-corner"></div><div class="topline"><span id="monthYear"></span></div><h1 class="mast"><span>Agenda</span><span>Cultural</span></h1><p class="intro">Tota la programació cultural del Gironès, el Pla de l’Estany, la Selva, la Garrotxa, el Baix Empordà i l’Alt Empordà.</p></header>
<section class="toolbar"><input id="search" class="search" type="search" placeholder="Cerca activitats, municipis, equipaments…"><div class="quick" id="quick"><span class="label">Quan</span><button data-p="all" class="active">Totes</button><button data-p="today">Avui</button><button data-p="tomorrow">Demà</button><button data-p="weekend">Aquest cap de setmana</button></div><div class="filterrow"><span class="label">Filtres</span><select id="municipality"><option value="">Tots els municipis</option></select><select id="type"><option value="">Tots els tipus d’activitat</option></select></div></section>
<main id="grid"><div class="empty">Carregant activitats…</div></main>
<script>
let DATA=[],q="",period="all",mun="",typ="";
const TYPES=["Teatre","Dansa","Música","Circ","Cinema i audiovisual","Exposicions","Visites i itineraris","Tallers","Xerrades i conferències","Literatura","Festes i cultura popular","Fires i mercats","Patrimoni","Altres"];
function nt(e){let s=((e.category||"")+" "+(e.title||"")+" "+(e.description||"")).toLocaleLowerCase("ca");if(/exposici|artistes convidades/.test(s))return"Exposicions";if(/cinema|projecci|documental|curtmetrat/.test(s))return"Cinema i audiovisual";if(/teatre|clown/.test(s))return"Teatre";if(/dansa|flamenc/.test(s))return"Dansa";if(/circ/.test(s))return"Circ";if(/música|musica|concert|òpera|opera|orquestra|cantada/.test(s))return"Música";if(/visita|itinerari|ruta|portes obertes/.test(s))return"Visites i itineraris";if(/taller/.test(s))return"Tallers";if(/xerrada|conferència|conferencia|taula rodona|jornada d.estudis|debat/.test(s))return"Xerrades i conferències";if(/literatura|poesia|llibre|contes|còmic|comic/.test(s))return"Literatura";if(/festa|aplec|cultura popular|sardana/.test(s))return"Festes i cultura popular";if(/fira|mercat|comerç|comerc/.test(s))return"Fires i mercats";if(/patrimoni/.test(s))return"Patrimoni";return"Altres"}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`,parts=d=>{if(!d)return null;let x=new Date(d+"T12:00:00");return{day:new Intl.DateTimeFormat("ca-ES",{day:"2-digit"}).format(x),month:new Intl.DateTimeFormat("ca-ES",{month:"short"}).format(x).replace(".","")}};
function active(e,d){let x=iso(d);return(e.sessions||[]).some(s=>s.date===x)||(e.date_start&&e.date_end&&x>=e.date_start&&x<=e.date_end)||(e.date_start===x)}
function mp(e){if(period==="all")return true;let t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());if(period==="today")return active(e,t);if(period==="tomorrow"){let d=new Date(t);d.setDate(d.getDate()+1);return active(e,d)}let day=t.getDay(),sat=new Date(t);if(day===0)sat.setDate(sat.getDate()-1);else if(day!==6)sat.setDate(sat.getDate()+6-day);let sun=new Date(sat);sun.setDate(sun.getDate()+1);return active(e,sat)||active(e,sun)}
function dd(e){let s=e.sessions?.[0];if(s?.date){let d=parts(s.date);return`<div class="day">${d.day}</div><div class="month">${d.month}</div><div class="time">${s.time?s.time+" h":""}</div>`}if(e.date_start){let a=parts(e.date_start),b=parts(e.date_end);return e.date_end&&e.date_end!==e.date_start?`<div class="range">DEL</div><div class="day">${a.day}</div><div class="month">${a.month}</div><div class="range" style="margin-top:8px">AL ${b.day} ${b.month}</div>`:`<div class="day">${a.day}</div><div class="month">${a.month}</div>`}return`<div class="time">Data per confirmar</div>`}
function render(){let z=q.trim().toLocaleLowerCase("ca"),rows=DATA.filter(e=>(!mun||e.municipality===mun)&&(!typ||nt(e)===typ)&&mp(e)&&(!z||[e.title,e.municipality,e.venue,e.category,e.description].filter(Boolean).join(" ").toLocaleLowerCase("ca").includes(z)));grid.innerHTML=rows.length?rows.map(e=>`<article class="card"><div class="media">${e.image?`<img loading="lazy" src="${e.image}" alt="" onload="if(this.naturalHeight>this.naturalWidth*1.05)this.classList.add('portrait')">`:""}</div><div class="body"><div class="datebox">${dd(e)}</div><div class="content"><span class="tag">${nt(e)}</span><div class="municipality">${e.municipality||""}</div><div class="title">${e.title}</div><div class="place">${e.venue||"Espai per confirmar"}</div>${e.sessions?.length>1?`<div class="more">+ ${e.sessions.length-1} sessions més</div>`:""}<a class="link" href="${e.url}" target="_blank" rel="noopener"><span class="arrow">→</span></a></div></div></article>`).join(""):`<div class="empty">No hi ha activitats amb aquests criteris.</div>`}
let now=new Date();monthYear.textContent=(new Intl.DateTimeFormat("ca-ES",{month:"long"}).format(now)+" "+now.getFullYear()).toLocaleUpperCase("ca");
fetch("data/events.json").then(r=>r.json()).then(j=>{DATA=j.events||[];let ms=[...new Set(DATA.map(e=>e.municipality).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ca"));municipality.innerHTML='<option value="">Tots els municipis</option>'+ms.map(v=>`<option>${v}</option>`).join("");let ts=TYPES.filter(t=>DATA.some(e=>nt(e)===t));type.innerHTML='<option value="">Tots els tipus d’activitat</option>'+ts.map(v=>`<option>${v}</option>`).join("");municipality.onchange=e=>{mun=e.target.value;render()};type.onchange=e=>{typ=e.target.value;render()};search.oninput=e=>{q=e.target.value;render()};document.querySelectorAll("#quick button").forEach(b=>b.onclick=()=>{period=b.dataset.p;document.querySelectorAll("#quick button").forEach(x=>x.classList.toggle("active",x===b));render()});render()}).catch(()=>grid.innerHTML='<div class="empty">No s’han pogut carregar les dades.</div>');
</script></body></html>

<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda cultural</title>

<style>
:root{
  --ultra:#3047D8;
  --cream:#F4F0E8;
  --ink:#171717;
  --lime:#C8FF45;
  --violet:#8D65FF;
  --pink:#F3B7CA;
  --paper:#FBF9F4;
  --line:rgba(23,23,23,.16)
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:Helvetica Neue,Helvetica,Arial,sans-serif
}

.hero{
  position:relative;
  overflow:hidden;
  padding:24px 4vw 28px;
  border-bottom:1px solid var(--ink);
  min-height:370px
}

.topline{
  display:flex;
  align-items:center;
  gap:24px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase
}

.topline:after{
  content:"";
  height:1px;
  background:var(--ultra);
  flex:1
}

.account{
  display:flex;
  gap:8px;
  align-items:center;
  margin-left:auto;
  white-space:nowrap
}

.account button{
  font:inherit;
  font-size:11px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  border:1px solid var(--ink);
  background:transparent;
  padding:8px 12px;
  border-radius:999px;
  cursor:pointer
}

.account button.signup{
  background:var(--lime)
}

.account button:hover{
  background:var(--ink);
  color:var(--cream)
}

.user-email{
  font-size:11px;
  text-transform:none;
  letter-spacing:0;
  font-weight:600
}

.mast{
  position:relative;
  z-index:2;
  margin:30px 0 0;
  color:var(--ultra);
  font-weight:800;
  font-size:clamp(72px,12vw,174px);
  line-height:.82;
  letter-spacing:-.075em;
  text-transform:uppercase
}

.mast .mast-line{
  display:block;
  font-size:1em;
  font-weight:inherit;
  line-height:inherit
}

.mast .al{color:var(--lime)}

.intro{
  position:absolute;
  z-index:3;
  right:5vw;
  top:112px;
  width:min(30vw,390px);
  font-size:clamp(16px,1.5vw,23px);
  line-height:1.12
}

.toolbar{
  padding:18px 4vw;
  border-bottom:1px solid var(--line);
  display:grid;
  gap:14px
}

.search{
  width:min(100%,520px);
  border:1px solid var(--line);
  border-radius:999px;
  padding:11px 16px;
  font-size:14px;
  background:transparent
}

.quick,.filterrow{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center
}

.label{
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase
}

.quick button{
  border:0;
  background:#E8E5DF;
  padding:10px 15px;
  border-radius:999px;
  cursor:pointer;
  font-weight:600
}

.quick button.active{background:var(--lime)}

select{
  border:1px solid var(--line);
  border-radius:999px;
  padding:10px 15px;
  background:var(--paper);
  font-weight:600
}

main{
  padding:30px 4vw 70px;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 24px
}

.card{
  background:var(--paper);
  border-bottom:1px solid var(--line)
}

.media{
  aspect-ratio:1/1;
  background:#e9e5dc;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center
}

.media img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 30%;
  display:block
}

.media img.portrait{object-fit:contain}

.body{
  display:grid;
  grid-template-columns:98px 1fr;
  min-height:170px
}

.datebox{
  padding:17px 8px;
  border-right:1px solid var(--line);
  color:var(--ultra);
  font-weight:800;
  text-transform:uppercase;
  text-align:left;
  display:flex;
  flex-direction:column;
  align-items:flex-start
}

.day{
  font-size:42px;
  line-height:.82;
  width:100%;
  text-align:left
}

.month{
  font-size:17px;
  margin-top:6px;
  width:100%;
  text-align:left
}

.time{
  margin-top:11px;
  color:var(--ink);
  font-size:19px;
  font-weight:800;
  text-transform:none;
  width:100%;
  text-align:left;
  white-space:nowrap
}

.range{
  font-size:12px;
  line-height:1.25
}

.content{
  padding:17px 18px 16px;
  display:flex;
  flex-direction:column
}

.tag{
  align-self:flex-start;
  padding:5px 8px;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  background:var(--violet)
}

.card:nth-child(3n+2) .tag{background:var(--pink)}
.card:nth-child(3n) .tag{background:var(--lime)}

.municipality{
  margin-top:5px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--ultra)
}

.title{
  font-size:clamp(21px,2vw,29px);
  line-height:.98;
  font-weight:750;
  letter-spacing:-.04em;
  margin:10px 0 12px;
  text-transform:uppercase
}

.place{
  margin-top:auto;
  font-size:13px
}

.more{
  margin-top:12px;
  font-size:12px
}

.link{
  display:flex;
  justify-content:flex-end;
  text-decoration:none
}

.arrow{font-size:28px}

.empty{
  grid-column:1/-1;
  padding:42px;
  border:1px dashed var(--ink)
}


/* MODAL D'USUARI */

.modal{
  position:fixed;
  inset:0;
  background:rgba(23,23,23,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px
}

.modal.open{display:flex}

.modalbox{
  position:relative;
  width:min(100%,500px);
  max-height:90vh;
  overflow:auto;
  background:var(--paper);
  padding:34px
}

.close{
  position:absolute;
  right:16px;
  top:13px;
  border:0;
  background:none;
  font-size:28px;
  cursor:pointer
}

.modal-title{
  color:var(--ultra);
  text-transform:uppercase;
  font-size:32px;
  line-height:.95;
  margin:0 35px 24px 0
}

.form{
  display:grid;
  gap:13px
}

.form label{
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em
}

.form input{
  width:100%;
  border:1px solid var(--line);
  background:white;
  padding:12px 13px;
  font-size:15px
}

.form button{
  border:0;
  background:var(--ultra);
  color:white;
  padding:13px 16px;
  font-weight:800;
  cursor:pointer;
  margin-top:6px
}

.form button:hover{
  background:var(--ink)
}

.form-message{
  font-size:13px;
  line-height:1.35;
  min-height:18px
}

.form-message.error{color:#a80000}
.form-message.success{color:#216400}

.switch-form{
  margin-top:20px;
  border-top:1px solid var(--line);
  padding-top:16px;
  font-size:13px
}

.switch-form button{
  border:0;
  background:none;
  padding:0;
  color:var(--ultra);
  text-decoration:underline;
  cursor:pointer;
  font-weight:700
}


@media(max-width:980px){
  .intro{
    position:relative;
    right:auto;
    top:auto;
    width:60%;
    margin:24px 0 0 auto
  }

  main{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:700px){
  .topline{
    flex-wrap:wrap
  }

  .topline:after{
    display:none
  }

  .account{
    width:100%;
    margin-left:0
  }
}

@media(max-width:640px){
  .hero{
    padding:18px;
    min-height:auto
  }

  .mast{
    font-size:clamp(62px,22vw,104px)
  }

  .intro{
    width:82%;
    font-size:16px
  }

  .toolbar{padding:14px 18px}

  main{
    padding:20px 18px 50px;
    grid-template-columns:1fr
  }

  .body{grid-template-columns:88px 1fr}

  .modalbox{padding:28px 20px}
}
</style>
</head>

<body>

<header class="hero">

  <div class="topline">

    <span id="monthYear"></span>

    <div class="account" id="accountLoggedOut">
      <button id="loginBtn">Inicia sessió</button>
      <button id="signupBtn" class="signup">Crea un compte</button>
    </div>

    <div class="account" id="accountLoggedIn" style="display:none">
      <span class="user-email" id="userEmail"></span>
      <button id="logoutBtn">Tanca sessió</button>
    </div>

  </div>

  <h1 class="mast">
    <span class="mast-line">Agenda</span>
    <span class="mast-line">Cultur<span class="al">[al]</span></span>
  </h1>

  <p class="intro">
    Tota la programació cultural del Gironès, el Pla de l’Estany,
    la Selva, la Garrotxa, el Baix Empordà i l’Alt Empordà.
  </p>

</header>


<section class="toolbar">

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Cerca activitats, municipis, equipaments…"
  >

  <div class="quick" id="quick">
    <span class="label">Quan</span>

    <button data-p="all" class="active">Totes</button>
    <button data-p="today">Avui</button>
    <button data-p="tomorrow">Demà</button>
    <button data-p="weekend">Aquest cap de setmana</button>
  </div>

  <div class="filterrow">
    <span class="label">Filtres</span>

    <select id="municipality">
      <option value="">Tots els municipis</option>
    </select>

    <select id="type">
      <option value="">Tots els tipus d’activitat</option>
    </select>
  </div>

</section>


<main id="grid">
  <div class="empty">Carregant activitats…</div>
</main>


<!-- MODAL REGISTRE -->

<div class="modal" id="signupModal">

  <div class="modalbox">

    <button class="close" data-close="signupModal">×</button>

    <h2 class="modal-title">Crea el teu compte</h2>

    <form class="form" id="signupForm">

      <label for="firstName">Nom</label>
      <input id="firstName" required autocomplete="given-name">

      <label for="lastName">Cognoms</label>
      <input id="lastName" required autocomplete="family-name">

      <label for="age">Edat</label>
      <input id="age" type="number" min="0" max="120">

      <label for="postalCode">Codi postal</label>
      <input id="postalCode" autocomplete="postal-code">

      <label for="signupEmail">Correu electrònic</label>
      <input
        id="signupEmail"
        type="email"
        required
        autocomplete="email"
      >

      <label for="signupPassword">Contrasenya</label>
      <input
        id="signupPassword"
        type="password"
        required
        minlength="6"
        autocomplete="new-password"
      >

      <button type="submit">Crear compte</button>

      <div
        id="signupMessage"
        class="form-message"
        aria-live="polite"
      ></div>

    </form>

    <div class="switch-form">
      Ja tens compte?
      <button id="goLogin" type="button">Inicia sessió</button>
    </div>

  </div>

</div>


<!-- MODAL LOGIN -->

<div class="modal" id="loginModal">

  <div class="modalbox">

    <button class="close" data-close="loginModal">×</button>

    <h2 class="modal-title">Inicia sessió</h2>

    <form class="form" id="loginForm">

      <label for="loginEmail">Correu electrònic</label>
      <input
        id="loginEmail"
        type="email"
        required
        autocomplete="email"
      >

      <label for="loginPassword">Contrasenya</label>
      <input
        id="loginPassword"
        type="password"
        required
        autocomplete="current-password"
      >

      <button type="submit">Entrar</button>

      <div
        id="loginMessage"
        class="form-message"
        aria-live="polite"
      ></div>

    </form>

    <div class="switch-form">
      Encara no tens compte?
      <button id="goSignup" type="button">Crea un compte</button>
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ------------------------------------------------
   SUPABASE
------------------------------------------------ */

const SUPABASE_URL =
  "https://kwgkugemwsbwvqgbpnhp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_-XuZxEd2uImUghliQ4ZwKw_t1BYylJE";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* ------------------------------------------------
   ELEMENTS D'AUTENTICACIÓ
------------------------------------------------ */

const signupModal = document.getElementById("signupModal");
const loginModal = document.getElementById("loginModal");

const signupBtn = document.getElementById("signupBtn");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

const accountLoggedOut =
  document.getElementById("accountLoggedOut");

const accountLoggedIn =
  document.getElementById("accountLoggedIn");

const userEmail =
  document.getElementById("userEmail");


function openModal(modal){
  modal.classList.add("open");
}

function closeModal(modal){
  modal.classList.remove("open");
}


signupBtn.onclick = () => openModal(signupModal);
loginBtn.onclick = () => openModal(loginModal);


document.querySelectorAll("[data-close]").forEach(button => {

  button.onclick = () => {
    closeModal(
      document.getElementById(button.dataset.close)
    );
  };

});


document.querySelectorAll(".modal").forEach(modal => {

  modal.addEventListener("click", event => {

    if(event.target === modal){
      closeModal(modal);
    }

  });

});


document.getElementById("goLogin").onclick = () => {
  closeModal(signupModal);
  openModal(loginModal);
};


document.getElementById("goSignup").onclick = () => {
  closeModal(loginModal);
  openModal(signupModal);
};


/* ------------------------------------------------
   ESTAT DE L'USUARI
------------------------------------------------ */

function showUser(user){

  if(user){

    accountLoggedOut.style.display = "none";
    accountLoggedIn.style.display = "flex";

    userEmail.textContent = user.email || "";

  }else{

    accountLoggedOut.style.display = "flex";
    accountLoggedIn.style.display = "none";

    userEmail.textContent = "";

  }

}


supabaseClient.auth.getSession().then(({data}) => {

  showUser(data.session?.user || null);

});


supabaseClient.auth.onAuthStateChange((event,session) => {

  showUser(session?.user || null);

});


/* ------------------------------------------------
   CREAR COMPTE
------------------------------------------------ */

document.getElementById("signupForm")
.addEventListener("submit", async event => {

  event.preventDefault();

  const message =
    document.getElementById("signupMessage");

  message.className = "form-message";
  message.textContent = "Creant el compte…";


  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const firstName =
    document.getElementById("firstName").value.trim();

  const lastName =
    document.getElementById("lastName").value.trim();

  const ageValue =
    document.getElementById("age").value;

  const postalCode =
    document.getElementById("postalCode").value.trim();


  const {data,error} =
    await supabaseClient.auth.signUp({

      email,
      password,

      options: {

        emailRedirectTo:
          "https://angmirallesbellmunt-spec.github.io/-agenda-cultural/",

        data: {
          first_name:firstName,
          last_name:lastName,
          age:ageValue || null,
          postal_code:postalCode || null
        }

      }

    });


  if(error){

    message.classList.add("error");
    message.textContent =
      "No s'ha pogut crear el compte: " +
      error.message;

    return;

  }


  message.classList.add("success");

  if(data.session){

    message.textContent =
      "Compte creat correctament.";

  }else{

    message.textContent =
      "Compte creat. Revisa el teu correu electrònic per confirmar el registre.";

  }

});


/* ------------------------------------------------
   INICIAR SESSIÓ
------------------------------------------------ */

document.getElementById("loginForm")
.addEventListener("submit", async event => {

  event.preventDefault();

  const message =
    document.getElementById("loginMessage");

  message.className = "form-message";
  message.textContent = "Entrant…";


  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    message.classList.add("error");
    message.textContent =
      "No s'ha pogut iniciar la sessió. Comprova el correu i la contrasenya.";

    return;

  }


  message.classList.add("success");
  message.textContent = "Sessió iniciada.";

  setTimeout(() => {
    closeModal(loginModal);
  },500);

});


/* ------------------------------------------------
   TANCAR SESSIÓ
------------------------------------------------ */

logoutBtn.onclick = async () => {

  await supabaseClient.auth.signOut();

};


/* ------------------------------------------------
   AGENDA ACTUAL
------------------------------------------------ */

let DATA=[],
    q="",
    period="all",
    mun="",
    typ="";


const TYPES=[
  "Teatre",
  "Dansa",
  "Música",
  "Circ",
  "Cinema i audiovisual",
  "Exposicions",
  "Visites i itineraris",
  "Tallers",
  "Xerrades i conferències",
  "Literatura",
  "Festes i cultura popular",
  "Fires i mercats",
  "Patrimoni",
  "Altres"
];


function nt(e){

  let s=(
    (e.category||"")+" "+
    (e.title||"")+" "+
    (e.description||"")
  ).toLocaleLowerCase("ca");

  if(/exposici|artistes convidades/.test(s))
    return "Exposicions";

  if(/cinema|projecci|documental|curtmetrat/.test(s))
    return "Cinema i audiovisual";

  if(/teatre|clown/.test(s))
    return "Teatre";

  if(/dansa|flamenc/.test(s))
    return "Dansa";

  if(/circ/.test(s))
    return "Circ";

  if(/música|musica|concert|òpera|opera|orquestra|cantada/.test(s))
    return "Música";

  if(/visita|itinerari|ruta|portes obertes/.test(s))
    return "Visites i itineraris";

  if(/taller/.test(s))
    return "Tallers";

  if(/xerrada|conferència|conferencia|taula rodona|jornada d.estudis|debat/.test(s))
    return "Xerrades i conferències";

  if(/literatura|poesia|llibre|contes|còmic|comic/.test(s))
    return "Literatura";

  if(/festa|aplec|cultura popular|sardana/.test(s))
    return "Festes i cultura popular";

  if(/fira|mercat|comerç|comerc/.test(s))
    return "Fires i mercats";

  if(/patrimoni/.test(s))
    return "Patrimoni";

  return "Altres";
}


const iso=d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;


const parts=d => {

  if(!d)return null;

  let x=new Date(d+"T12:00:00");

  return{
    day:new Intl.DateTimeFormat(
      "ca-ES",
      {day:"2-digit"}
    ).format(x),

    month:new Intl.DateTimeFormat(
      "ca-ES",
      {month:"short"}
    ).format(x).replace(".","")
  };
};


function active(e,d){

  let x=iso(d);

  return(
    (e.sessions||[]).some(s=>s.date===x) ||
    (
      e.date_start &&
      e.date_end &&
      x>=e.date_start &&
      x<=e.date_end
    ) ||
    e.date_start===x
  );
}


function mp(e){

  if(period==="all")
    return true;

  let t=new Date();

  t=new Date(
    t.getFullYear(),
    t.getMonth(),
    t.getDate()
  );

  if(period==="today")
    return active(e,t);

  if(period==="tomorrow"){

    let d=new Date(t);
    d.setDate(d.getDate()+1);

    return active(e,d);
  }


  let day=t.getDay(),
      sat=new Date(t);

  if(day===0)
    sat.setDate(sat.getDate()-1);

  else if(day!==6)
    sat.setDate(sat.getDate()+6-day);


  let sun=new Date(sat);
  sun.setDate(sun.getDate()+1);

  return active(e,sat) || active(e,sun);
}


function dd(e){

  let s=e.sessions?.[0];

  if(s?.date){

    let d=parts(s.date);

    return`
      <div class="day">${d.day}</div>
      <div class="month">${d.month}</div>
      <div class="time">
        ${s.time?s.time+" h":""}
      </div>
    `;
  }


  if(e.date_start){

    let a=parts(e.date_start),
        b=parts(e.date_end);

    return e.date_end &&
           e.date_end!==e.date_start

      ?`
        <div class="range">DEL</div>
        <div class="day">${a.day}</div>
        <div class="month">${a.month}</div>
        <div class="range" style="margin-top:8px">
          AL ${b.day} ${b.month}
        </div>
      `

      :`
        <div class="day">${a.day}</div>
        <div class="month">${a.month}</div>
      `;
  }


  return`
    <div class="time">
      Data per confirmar
    </div>
  `;
}


function render(){

  let z=q.trim().toLocaleLowerCase("ca");

  let rows=DATA.filter(e=>

    (!mun || e.municipality===mun) &&

    (!typ || nt(e)===typ) &&

    mp(e) &&

    (
      !z ||

      [
        e.title,
        e.municipality,
        e.venue,
        e.category,
        e.description
      ]
      .filter(Boolean)
      .join(" ")
      .toLocaleLowerCase("ca")
      .includes(z)
    )
  );


  grid.innerHTML=rows.length

    ?rows.map(e=>`

      <article class="card">

        <div class="media">

          ${
            e.image
            ?`
              <img
                loading="lazy"
                src="${e.image}"
                alt=""
                onload="
                  if(
                    this.naturalHeight >
                    this.naturalWidth*1.05
                  )
                  this.classList.add('portrait')
                "
              >
            `
            :""
          }

        </div>

        <div class="body">

          <div class="datebox">
            ${dd(e)}
          </div>

          <div class="content">

            <span class="tag">
              ${nt(e)}
            </span>

            <div class="municipality">
              ${e.municipality||""}
            </div>

            <div class="title">
              ${e.title}
            </div>

            <div class="place">
              ${e.venue||"Espai per confirmar"}
            </div>

            ${
              e.sessions?.length>1
              ?`
                <div class="more">
                  + ${e.sessions.length-1} sessions més
                </div>
              `
              :""
            }

            <a
              class="link"
              href="${e.url}"
              target="_blank"
              rel="noopener"
            >
              <span class="arrow">→</span>
            </a>

          </div>

        </div>

      </article>

    `).join("")

    :`
      <div class="empty">
        No hi ha activitats amb aquests criteris.
      </div>
    `;
}


/* MES ACTUAL */

let now=new Date();

monthYear.textContent=(
  new Intl.DateTimeFormat(
    "ca-ES",
    {month:"long"}
  ).format(now)
  +" "+
  now.getFullYear()
).toLocaleUpperCase("ca");


/* CARREGA DE LES ACTIVITATS */

fetch("data/events.json")

.then(r=>r.json())

.then(j=>{

  DATA=j.events||[];


  let ms=[
    ...new Set(
      DATA
      .map(e=>e.municipality)
      .filter(Boolean)
    )
  ]
  .sort((a,b)=>a.localeCompare(b,"ca"));


  municipality.innerHTML=
    '<option value="">Tots els municipis</option>'+
    ms.map(v=>`<option>${v}</option>`).join("");


  let ts=TYPES.filter(
    t=>DATA.some(e=>nt(e)===t)
  );


  type.innerHTML=
    '<option value="">Tots els tipus d’activitat</option>'+
    ts.map(v=>`<option>${v}</option>`).join("");


  municipality.onchange=e=>{
    mun=e.target.value;
    render();
  };


  type.onchange=e=>{
    typ=e.target.value;
    render();
  };


  search.oninput=e=>{
    q=e.target.value;
    render();
  };


  document
  .querySelectorAll("#quick button")
  .forEach(b=>{

    b.onclick=()=>{

      period=b.dataset.p;

      document
      .querySelectorAll("#quick button")
      .forEach(x=>
        x.classList.toggle(
          "active",
          x===b
        )
      );

      render();
    };

  });


  render();

})

.catch(()=>{

  grid.innerHTML=
    '<div class="empty">No s’han pogut carregar les dades.</div>';

});

</script>

</body>
</html>

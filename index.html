<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda cultural</title>
<style>
:root{--ultra:#3047D8;--cream:#F4F0E8;--ink:#171717;--lime:#C8FF45;--violet:#8D65FF;--pink:#FF7DAE;--paper:#FBF9F4;--line:rgba(23,23,23,.16)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
a{color:inherit}.hero{position:relative;overflow:hidden;padding:24px 4vw 28px;border-bottom:1px solid var(--ink);min-height:370px}.topline{display:flex;align-items:center;gap:24px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.topline:after{content:"";height:1px;background:var(--ultra);flex:1}.mast{position:relative;z-index:2;margin:30px 0 0;color:var(--ultra);font-weight:800;font-size:clamp(72px,12vw,174px);line-height:.72;letter-spacing:-.075em;text-transform:uppercase}.mast span{display:block}.intro{position:absolute;z-index:3;right:5vw;top:112px;width:min(25vw,320px);font-size:clamp(16px,1.5vw,23px);line-height:1.12}.lime-slash{position:absolute;z-index:1;width:72px;height:570px;background:var(--lime);left:37%;top:-135px;transform:rotate(35deg)}.pink-corner{position:absolute;right:-55px;bottom:-105px;width:230px;height:180px;border-radius:50% 50% 0 0;background:var(--pink)}
.toolbar{padding:18px 4vw;display:flex;gap:18px;align-items:center;border-bottom:1px solid var(--line);background:var(--cream)}.search{min-width:280px;flex:0 1 370px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:14px;background:transparent}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{border:0;background:#E8E5DF;padding:10px 15px;border-radius:999px;cursor:pointer;font:600 13px/1 Helvetica Neue,Helvetica,Arial,sans-serif}.filters button.active{background:var(--lime);color:var(--ink)}
main{padding:30px 4vw 70px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px}.card{background:var(--paper);min-width:0;border-bottom:1px solid var(--line);display:flex;flex-direction:column}.media{aspect-ratio:16/9;background:#ddd;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}.card:hover .media img{transform:scale(1.015)}.body{display:grid;grid-template-columns:92px 1fr;min-height:170px}.datebox{padding:17px 12px;border-right:1px solid var(--line);color:var(--ultra);font-weight:800;text-transform:uppercase}.day{font-size:42px;line-height:.82;letter-spacing:-.06em}.month{font-size:17px;margin-top:6px}.time{margin-top:8px;color:var(--ink);font-size:12px;font-weight:500;text-transform:none}.content{padding:17px 18px 16px;display:flex;flex-direction:column;min-width:0}.source{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink);opacity:.65}.title{font-size:clamp(21px,2vw,29px);line-height:.98;font-weight:750;letter-spacing:-.04em;margin:8px 0 12px}.place{margin-top:auto;font-size:13px;line-height:1.25}.tag{align-self:flex-start;padding:5px 8px;margin-bottom:3px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--violet)}.card:nth-child(3n+2) .tag{background:var(--pink)}.card:nth-child(3n) .tag{background:var(--lime)}.more{margin-top:12px;font-size:12px}.link{display:flex;justify-content:space-between;align-items:end;text-decoration:none}.arrow{font-size:28px;line-height:.8}.empty{grid-column:1/-1;padding:42px;border:1px dashed var(--ink)}
@media(max-width:980px){.hero{min-height:310px}.intro{position:relative;right:auto;top:auto;width:60%;margin:24px 0 0 auto}.mast{font-size:clamp(70px,14vw,130px)}main{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%;min-width:0;flex:auto}}
@media(max-width:640px){.hero{padding:18px 18px 24px;min-height:auto}.topline{font-size:11px}.mast{font-size:clamp(62px,22vw,104px);line-height:.76;margin-top:24px}.intro{width:76%;margin-top:30px;font-size:16px}.lime-slash{width:48px;height:430px;left:48%;top:-120px}.pink-corner{width:150px;height:120px}.toolbar{padding:14px 18px}.filters{gap:6px}.filters button{padding:9px 12px}main{padding:20px 18px 50px;grid-template-columns:1fr;gap:22px}.body{grid-template-columns:82px 1fr}.day{font-size:38px}}
</style>
</head>
<body>
<header class="hero"><div class="lime-slash"></div><div class="pink-corner"></div><div class="topline"><span>Agenda cultural</span></div><h1 class="mast"><span>Agenda</span><span>Cultural</span></h1><p class="intro">Activitats recollides automàticament de Figueres a Escena, Museu de l’Empordà i Agenda de la Bisbal.</p></header>
<section class="toolbar"><input id="search" class="search" type="search" placeholder="Cerca activitats, municipis, equipaments…"><div class="filters" id="filters"></div></section>
<main id="grid"><div class="empty">Carregant activitats…</div></main>
<script>
let DATA=[], current="Totes", query="";
const parts=d=>{if(!d)return null;const x=new Date(d+"T12:00:00");return{day:new Intl.DateTimeFormat("ca-ES",{day:"2-digit"}).format(x),month:new Intl.DateTimeFormat("ca-ES",{month:"short"}).format(x).replace(".","")}};
function render(){
 const q=query.trim().toLocaleLowerCase("ca");
 const rows=DATA.filter(e=>(current==="Totes"||e.municipality===current)&&(!q||[e.title,e.municipality,e.venue,e.category,e.source].filter(Boolean).join(" ").toLocaleLowerCase("ca").includes(q)));
 document.querySelector("#grid").innerHTML=rows.length?rows.map(e=>{
  const s=e.sessions?.[0], d=parts(s?.date);
  return `<article class="card"><div class="media">${e.image?`<img loading="lazy" src="${e.image}" alt="">`:""}</div><div class="body"><div class="datebox">${d?`<div class="day">${d.day}</div><div class="month">${d.month}</div><div class="time">${s?.time||""}</div>`:`<div class="time">Data per confirmar</div>`}</div><div class="content">${e.category?`<span class="tag">${e.category}</span>`:""}<div class="source">${e.source||""}</div><div class="title">${e.title}</div><div class="place">${e.venue||"Espai per confirmar"}<br>${e.municipality||""}</div>${e.sessions?.length>1?`<div class="more">+ ${e.sessions.length-1} sessions més</div>`:""}<a class="link" href="${e.url}" target="_blank" rel="noopener"><span></span><span class="arrow">→</span></a></div></div></article>`}).join(""):`<div class="empty">No hi ha activitats amb aquests criteris.</div>`;
}
fetch("data/events.json").then(r=>r.json()).then(j=>{DATA=j.events||[];const vals=["Totes",...new Set(DATA.map(e=>e.municipality).filter(Boolean))];document.querySelector("#filters").innerHTML=vals.map(v=>`<button data-v="${v}" class="${v==="Totes"?"active":""}">${v}</button>`).join("");document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{current=b.dataset.v;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("active",x===b));render()});document.querySelector("#search").addEventListener("input",e=>{query=e.target.value;render()});render()}).catch(()=>document.querySelector("#grid").innerHTML='<div class="empty">No s’han pogut carregar les dades de <b>data/events.json</b>.</div>');
</script></body></html>
